server:
  http_listen_port: 3200
  log_level: warn

stream_over_http_enabled: true

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

query_frontend:
  search:
    max_duration: 0
  metrics:
    max_duration: 0

metrics_generator:
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      flush_to_storage: true
      max_live_traces: 1000
      max_block_duration: 30m
      trace_idle_period: 10s

overrides:
  defaults:
    metrics_generator:
      processors:
        - local-blocks

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
