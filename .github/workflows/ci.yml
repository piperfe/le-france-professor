name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (block on CRITICAL only)
        run: npm audit --audit-level=critical

  test-backend:
    name: Test · Backend
    runs-on: ubuntu-latest
    needs: security
    timeout-minutes: 45

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

  test-frontend:
    name: Test · Frontend
    runs-on: ubuntu-latest
    needs: security
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

  build-backend:
    name: Build · Backend image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build · Frontend image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy · Backend to Oracle Cloud
    runs-on: ubuntu-latest
    environment: production
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && needs.build-backend.result == 'success'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.sha }}
      PULL_POLICY: always
      NODE_ENV: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Trust VM host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VM_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Point Docker CLI at the VM
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          docker context create vm --docker "host=ssh://$VM_USER@$VM_HOST"
          docker context use vm

      - name: Ensure shared network exists
        run: docker network inspect le-france-network >/dev/null 2>&1 || docker network create le-france-network

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend images
        run: docker compose pull backend whisper piper

      - name: Run database migrations
        run: docker compose run --rm backend npm run db:migrate

      - name: Start voice services (Whisper + Piper)
        run: docker compose up -d whisper piper

      - name: Wait for voice services to be healthy
        run: |
          for service in whisper piper; do
            echo "Waiting for $service to be healthy..."
            for i in $(seq 1 12); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "le-france-$service" 2>/dev/null || echo "starting")
              echo "  Attempt $i/12: $service = $status"
              [ "$status" = "healthy" ] && break
              [ "$i" = "12" ] && { echo "Warning: $service may not be fully healthy"; }
              sleep 5
            done
          done

      - name: Start backend
        run: docker compose up -d backend

      - name: Verify backend is healthy
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 12); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "le-france-backend" 2>/dev/null || echo "starting")
            echo "  Attempt $i/12: backend = $status"
            [ "$status" = "healthy" ] && break
            [ "$i" = "12" ] && { echo "ERROR: backend failed to become healthy"; exit 1; }
            sleep 5
          done

      - name: Verify backend API endpoint
        run: |
          echo "Testing backend API endpoint..."
          for i in $(seq 1 6); do
            if curl -f http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "✓ Backend API is responding"
              exit 0
            fi
            echo "  Attempt $i/6: Waiting for API response..."
            sleep 5
          done
          echo "ERROR: Backend API not responding"
          exit 1

      - name: Cleanup old images
        run: docker image prune -af --filter "until=168h"

      - name: Deployment summary
        run: |
          echo "=== Deployment Summary ==="
          echo "Image tag: $IMAGE_TAG"
          echo "Services deployed:"
          docker compose ps backend whisper piper
          echo "=== Deployment Complete ==="
