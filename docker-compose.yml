networks:
  le-france-network:
    name: le-france-network
    driver: bridge

services:
  whisper:
    image: ghcr.io/${REGISTRY_OWNER}/le-france-professor/whisper:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/whisper.Dockerfile
    pull_policy: ${PULL_POLICY:-build}
    ports:
      - "7600:7600"
    volumes:
      - ./docker/models:/models:ro
    networks:
      - le-france-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7600/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  piper:
    image: ghcr.io/${REGISTRY_OWNER}/le-france-professor/piper:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/piper.Dockerfile
    pull_policy: ${PULL_POLICY:-build}
    ports:
      - "7602:7602"
    volumes:
      - ./docker/models:/models:ro
    networks:
      - le-france-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7602/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    image: ghcr.io/${REGISTRY_OWNER}/le-france-professor/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    pull_policy: ${PULL_POLICY:-build}
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: /data/le-france.db
      NODE_ENV: ${NODE_ENV:-development}
      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:7600}
      PIPER_URL: ${PIPER_URL:-http://piper:7602}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-console}
    volumes:
      - backend-db:/data
    networks:
      - le-france-network
    depends_on:
      whisper:
        condition: service_healthy
      piper:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/${REGISTRY_OWNER}/le-france-professor/frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    pull_policy: ${PULL_POLICY:-build}
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3001/api}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:7600}
      PIPER_URL: ${PIPER_URL:-http://piper:7602}
    networks:
      - le-france-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-db:
